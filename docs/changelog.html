<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changelog - vrcdbfinder</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f5f5f7; --line:#ddd; --accent:#5b5bd6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111114; --fg:#eee; --muted:#9a9aa5; --card:#1a1a1f; --line:#2c2c34; --accent:#8b8bff; } }
  body { margin:0 auto; padding:24px 16px 64px; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; max-width:800px; }
  a { color:var(--accent); } .meta { color:var(--muted); font-size:13px; }
  .run { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:10px; }
  .ev { margin:2px 0; } h1 { font-size:1.4rem; margin-bottom:4px; }
</style>
</head>
<body>
<h1>Changelog</h1>
<div class="meta"><a href="index.html">Back to the list</a> · <a href="feed.xml">Atom feed</a></div>
<div id="out" style="margin-top:16px">Loading...</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON = { new_active:'🟢', went_stale:'🟠', gone:'⚫', revived:'🔄', link_down:'🔴', link_recovered:'✅', initial:'🚀', flagged:'🚩' };
fetch('changelog.json').then(r => r.json()).then(d => {
  const runs = d.runs.slice().reverse().slice(0, 60);
  document.getElementById('out').innerHTML = runs.map(r => `<div class="run">
    <div class="meta">${esc(new Date(r.at).toLocaleString())} · ${esc(r.mode)} scan · ${r.stats?.requests ?? '?'} requests (${r.stats?.cached ?? 0} cached)</div>
    ${r.events.length ? r.events.map(e => `<div class="ev">${ICON[e.type] || '•'} ${e.repo ? `<a href="https://github.com/${encodeURI(e.repo)}" target="_blank" rel="noopener noreferrer">${esc(e.repo)}</a> - ` : ''}${esc(e.text)}</div>`).join('') : '<div class="meta">No changes.</div>'}
  </div>`).join('') || 'No scans yet.';
}).catch(() => { document.getElementById('out').textContent = 'Could not load changelog.json.'; });
</script>
</body>
</html>
