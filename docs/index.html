<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vrcdbfinder</title>
<link rel="alternate" type="application/atom+xml" href="feed.xml" title="Updates">
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f5f5f7; --line:#ddd; --ok:#1a7f37; --bad:#b42318; --warn:#b54708; --accent:#5b5bd6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111114; --fg:#eee; --muted:#9a9aa5; --card:#1a1a1f; --line:#2c2c34; --ok:#3fb950; --bad:#f85149; --warn:#e3a008; --accent:#8b8bff; } }
  * { box-sizing: border-box; }
  body { margin:0 auto; padding:24px 16px 64px; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; max-width:1000px; }
  h1 { margin:0 0 4px; font-size:1.5rem; } h2 { font-size:1.1rem; margin:28px 0 8px; }
  a { color:var(--accent); } .sub { color:var(--muted); margin-bottom:8px; } nav a { margin-right:14px; font-size:14px; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:14px 0 8px; }
  input[type=search], input[type=url], select { padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; }
  input[type=search] { flex:1; min-width:180px; } input[type=url] { flex:1; min-width:220px; }
  button { padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 14px; }
  .chip { padding:2px 10px; border-radius:99px; border:1px solid var(--line); background:transparent; font-size:13px; cursor:pointer; }
  .chip.sel { background:var(--accent); color:#fff; border-color:var(--accent); }
  .repo { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .name { font-weight:600; text-decoration:none; } .grow { flex:1; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); margin-right:4px; white-space:nowrap; }
  .on { color:var(--ok); border-color:var(--ok); } .off { color:var(--bad); border-color:var(--bad); } .warn { color:var(--warn); border-color:var(--warn); }
  .score { font-weight:700; font-variant-numeric:tabular-nums; padding:1px 8px; border-radius:6px; background:var(--accent); color:#fff; cursor:help; }
  .meta { color:var(--muted); font-size:13px; margin-top:4px; } .links { margin-top:6px; font-size:13px; overflow-wrap:anywhere; }
  svg.spark { width:80px; height:20px; color:var(--accent); } .empty { color:var(--muted); padding:16px 0; }
  details.grave summary { cursor:pointer; color:var(--muted); }
</style>
</head>
<body>
<h1>VRC Avatar Database Finder</h1>
<div class="sub" id="sub">Loading...</div>
<nav><a href="changelog.html">Changelog</a><a href="feed.xml">Feed</a><a id="src" href="#">Source</a><a href="#submit">Submit a repo</a></nav>

<div class="controls">
  <input type="search" id="q" placeholder="Filter by name, description or tag">
  <select id="sort">
    <option value="score">Sort: score</option><option value="stars">Sort: stars</option><option value="push">Sort: last push</option>
    <option value="new">Sort: newest found</option><option value="name">Sort: name</option>
  </select>
</div>
<div class="controls">
  <label><input type="checkbox" id="active" checked> Active only</label>
  <label><input type="checkbox" id="db" checked> Looks like a database</label>
  <span class="grow"></span>
  <button id="csv">Export CSV</button><button id="json">Export JSON</button>
</div>
<div class="chips" id="chips"></div>
<div id="list"></div>

<details class="grave" id="graveWrap"><summary id="graveSum">Graveyard</summary><div id="grave"></div></details>

<h2 id="submit">Submit a repository</h2>
<div class="controls">
  <input type="url" id="surl" placeholder="https://github.com/owner/repo">
  <button id="sbtn">Open submission form</button>
</div>
<div class="sub">Opens a prefilled GitHub issue. Valid public repos are queued automatically. Repos hosting ripped or unauthorized content are never listed.</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeHref = u => { try { const x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : '#'; } catch { return '#'; } };
let data = { repos: [] }, grave = { repos: [] }, repository = null, selTags = new Set();

function spark(a) {
  const max = Math.max(1, ...a), w = 80, h = 20;
  const pts = a.map((v, i) => `${(i * w / (a.length - 1)).toFixed(1)},${(h - 2 - v / max * (h - 4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Commits per week, last 12 weeks"><polyline fill="none" stroke="currentColor" stroke-width="1.5" points="${pts}"/></svg>`;
}
function view() {
  const q = document.getElementById('q').value.toLowerCase();
  const activeOnly = document.getElementById('active').checked, dbOnly = document.getElementById('db').checked;
  const sort = document.getElementById('sort').value;
  let rows = data.repos.filter(r =>
    (!activeOnly || r.active) && (!dbOnly || r.looks_like_db) &&
    [...selTags].every(t => r.tags.includes(t)) &&
    (r.full_name + ' ' + r.description + ' ' + r.tags.join(' ')).toLowerCase().includes(q));
  const by = { score: (a, b) => b.score - a.score, stars: (a, b) => b.stars - a.stars, push: (a, b) => a.days_since_push - b.days_since_push,
    new: (a, b) => new Date(b.first_seen) - new Date(a.first_seen), name: (a, b) => a.full_name.localeCompare(b.full_name) };
  rows.sort(by[sort]);
  return rows;
}
function card(r) {
  const isNew = Date.now() - new Date(r.first_seen).getTime() < 7 * 864e5;
  const trend = r.score_prev == null ? '' : r.score > r.score_prev ? `<span class="tag on" title="was ${r.score_prev}">▲ ${r.score - r.score_prev}</span>` : r.score < r.score_prev ? `<span class="tag off" title="was ${r.score_prev}">▼ ${r.score_prev - r.score}</span>` : '';
  const b = r.score_breakdown || {};
  const tip = Object.entries(b).map(([k, v]) => `${k}: ${v}`).join(', ');
  const srcs = (r.sources || []).map(s => {
    const label = s.label || (s.kind === 'discord' ? 'Discord invite' : s.url);
    const st = s.status ? `<span class="tag ${s.status === 'up' ? 'on' : 'off'}">${s.status === 'up' ? 'up' : 'down' + (s.down_days ? ' ' + s.down_days + 'd' : '')}</span>` : '';
    return `${st}<span class="tag">${esc(s.kind)}</span><a href="${esc(safeHref(s.url))}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>${s.uptime != null ? ` <span class="meta">${s.uptime}% up</span>` : ''}`;
  }).join(' · ');
  return `<div class="repo">
    <div class="top">
      <a class="name" href="${esc(safeHref(r.url))}" target="_blank" rel="noopener noreferrer">${esc(r.full_name)}</a>
      <span class="tag ${r.active ? 'on' : r.archived ? 'off' : 'warn'}">${r.active ? 'active' : r.archived ? 'archived' : 'stale'}</span>
      ${r.looks_like_db ? '<span class="tag">database</span>' : ''}${isNew ? '<span class="tag on">NEW</span>' : ''}${trend}
      <span class="grow"></span>${spark(r.activity || [])}<span class="score" title="${esc(tip)}">${r.score}</span>
    </div>
    <div>${esc(r.description)}</div>
    <div class="meta">★ ${r.stars} · pushed ${r.days_since_push}d ago${r.language ? ' · ' + esc(r.language) : ''}${r.signals?.avatarIds ? ` · ${r.signals.avatarIds} avatar IDs in README` : ''}${r.forks?.length ? ` · ${r.forks.length} fork(s) collapsed` : ''}</div>
    ${r.tags?.length ? `<div class="meta">${r.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
    ${srcs ? `<div class="links">${srcs}</div>` : ''}
  </div>`;
}
function render() {
  const rows = view();
  document.getElementById('list').innerHTML = rows.map(card).join('') || '<div class="empty">No results match these filters.</div>';
  const counts = {}; data.repos.forEach(r => (r.tags || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
  document.getElementById('chips').innerHTML = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 24)
    .map(([t, n]) => `<button class="chip ${selTags.has(t) ? 'sel' : ''}" data-t="${esc(t)}">${esc(t)} ${n}</button>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { selTags.has(c.dataset.t) ? selTags.delete(c.dataset.t) : selTags.add(c.dataset.t); render(); });
  document.getElementById('graveSum').textContent = `Graveyard (${grave.repos.length})`;
  document.getElementById('grave').innerHTML = grave.repos.map(g => `<div class="repo"><a class="name" href="${esc(safeHref(g.url))}" target="_blank" rel="noopener noreferrer">${esc(g.full_name)}</a> <span class="tag off">${esc(g.reason)}</span><div class="meta">${esc(g.description)} · ★ ${g.stars} · last push ${esc((g.pushed_at || '').slice(0, 10))}</div></div>`).join('') || '<div class="empty">Nothing here yet.</div>';
}
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); URL.revokeObjectURL(a.href); }
const csvCell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
document.getElementById('csv').onclick = () => {
  const head = ['name', 'url', 'score', 'active', 'database', 'stars', 'language', 'days_since_push', 'tags', 'sources'];
  const lines = [head.join(',')].concat(view().map(r => [r.full_name, r.url, r.score, r.active, r.looks_like_db, r.stars, r.language, r.days_since_push, (r.tags || []).join('|'), (r.sources || []).map(s => s.url).join('|')].map(csvCell).join(',')));
  download('vrc-avatar-dbs.csv', lines.join('\n'), 'text/csv');
};
document.getElementById('json').onclick = () => download('vrc-avatar-dbs.json', JSON.stringify(view(), null, 2), 'application/json');
['q', 'sort', 'active', 'db'].forEach(id => document.getElementById(id).addEventListener('input', render));
document.getElementById('sbtn').onclick = () => {
  const u = document.getElementById('surl').value.trim();
  if (!/^https:\/\/github\.com\/[\w.-]+\/[\w.-]+\/?$/.test(u)) { alert('Enter a GitHub repo URL like https://github.com/owner/repo'); return; }
  const repo = repository || (location.hostname.endsWith('.github.io') ? `${location.hostname.split('.')[0]}/${location.pathname.split('/')[1]}` : null);
  if (!repo) { alert('Repository not known yet. Run a scan first.'); return; }
  open(`https://github.com/${repo}/issues/new?template=submit.yml&title=${encodeURIComponent('Submit: ' + u.split('github.com/')[1])}&repo_url=${encodeURIComponent(u)}`, '_blank', 'noopener');
};
Promise.all([fetch('results.json').then(r => r.json()), fetch('graveyard.json').then(r => r.json()).catch(() => ({ repos: [] }))]).then(([d, g]) => {
  data = d; grave = g; repository = d.repository;
  if (repository) document.getElementById('src').href = `https://github.com/${repository}`;
  const act = d.repos.filter(r => r.active).length;
  document.getElementById('sub').textContent = d.repos.length ? `${d.repos.length} repos tracked, ${act} active (pushed in the last ${d.activeDays} days). Updated ${new Date(d.generatedAt).toLocaleString()}.` : 'No results yet. Run the "Find VRC avatar DBs" workflow from the Actions tab.';
  render();
}).catch(() => { document.getElementById('sub').textContent = 'Could not load results.json.'; });
</script>
</body>
</html>
